# Runs the test suite on every PR (on GitHub's machines, never the bot's
# server). The "tests" check must pass before a PR can be merged.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
